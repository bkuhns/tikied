<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stage Info - PJM Experiment</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Pako for ZLIB compression/decompression -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <style>
        .wave-card { border-left: 4px solid #4CAF50; padding: 10px 15px; background: #f9f9f9; margin-bottom: 15px; border-radius: 0 4px 4px 0; border-top: 1px solid #eee; border-right: 1px solid #eee; border-bottom: 1px solid #eee; }
        .wave-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 1.1em; margin-bottom: 10px; }
        .subwave-table { width: 100%; border-collapse: collapse; }
        .subwave-table th, .subwave-table td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; }
        .subwave-table th { color: #555; font-weight: bold; }
        .icon-container { width: 32px; height: 32px; display: inline-block; vertical-align: middle; margin-right: 10px; image-rendering: pixelated; }
    </style>
    <!-- Import Map for React -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime"
      }
    }
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="dist/stage_info_app.js"></script>
</body>
</html>
