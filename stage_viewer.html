<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stage Viewer - PJM Experiment</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Pako for ZLIB compression/decompression -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <script type="module" src="dist/stage_viewer_app.js"></script>
</head>
<body>
    <div class="container">
        <nav class="breadcrumb">
            <a href="index.html">← Back to Hub</a>
        </nav>
        <h1>Stage Viewer</h1>
        <p>Instantly extract and view stages directly from the game archives.</p>
        
        <div class="section">
            <h2>1. Select Game Archives</h2>
            <div class="form-group">
                <label for="pkiInput">Original <code>monsters.pkiwin</code>:</label>
                <input type="file" id="pkiInput" accept=".pkiwin">
            </div>
            <div class="form-group">
                <label for="pkdInput">Original <code>monsters.pkdwin</code>:</label>
                <input type="file" id="pkdInput" accept=".pkdwin">
            </div>
            <button id="loadBtn" disabled>Load Archives</button>
            <div id="status" class="status-msg"></div>
        </div>

        <div id="viewerSection" class="section hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2 style="margin-bottom: 0;">2. View Stage</h2>
                <button id="maximizeBtn" style="padding: 5px 10px; font-size: 0.9rem;">Maximize View</button>
            </div>
            <div class="form-group">
                <label for="stageSelect">Select a Stage:</label>
                <select id="stageSelect" style="padding: 5px; font-size: 1rem; width: 100%; max-width: 400px;"></select>
            </div>

            <div class="form-group">
                <label style="display: inline-flex; align-items: center; gap: 8px; cursor: pointer; margin-right: 15px;">
                    <input type="checkbox" id="showTreesCheck" checked>
                    Show Trees
                </label>
                <label style="display: inline-flex; align-items: center; gap: 8px; cursor: pointer; margin-right: 15px;">
                    <input type="checkbox" id="showRocksCheck" checked>
                    Show Rocks
                </label>
                <label style="display: inline-flex; align-items: center; gap: 8px; cursor: pointer; margin-right: 15px;">
                    <input type="checkbox" id="showWaterCheck" checked>
                    Show Water
                </label>
                <label style="display: inline-flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" id="showHudBarCheck" checked>
                    Show HUD Bar
                </label>
            </div>
            
            <div class="canvas-container">
                <canvas id="stageCanvas"></canvas>
            </div>
        </div>
    </div>
</body>
</html>
